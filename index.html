<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFFFF" id="theme-colour">
<title>Platform Piano</title>
<meta name="description" content="Pick your seat on your phone, then play the song on the floor of a train car with your feet.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Platform Piano">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/src/tokens.css">
<link rel="stylesheet" href="/src/app/app.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <button class="back" id="back" type="button" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="track" id="track" role="progressbar" aria-label="Where you are in the steps" aria-valuemin="0" aria-valuemax="4" aria-valuenow="1">
      <i class="t-base"></i>
      <b></b><b></b><b></b><b></b><b></b>
      <i class="t-done"></i>
      <span class="t-train"></span>
    </div>
  </header>
  <div class="status" id="status"><p role="status"></p></div>
  <main class="screen" id="screen"></main>
</div>
<script type="module" src="/src/app/main.js"></script>
</body>
</html>
