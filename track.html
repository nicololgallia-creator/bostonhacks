<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Platform Piano: camera check</title>
<link rel="icon" href="data:,">
<style>
  body { margin: 0; background: #000; color: #fff; font: 16px/1.4 system-ui, sans-serif; }
  #bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px; }
  select { font: inherit; min-height: 44px; }
  #stats { margin-left: auto; font-variant-numeric: tabular-nums; }
  #error { margin: 0 16px 12px; padding: 12px 16px; border: 2px solid #ff5a5a; color: #ff9a9a; }
  #stage { position: relative; width: fit-content; max-width: 100%; margin: 0 auto; }
  #stage > video, #stage > img { display: block; max-width: 100%; max-height: calc(100vh - 80px); }
  #stage > canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="bar">
  <label>Camera <select id="camera"></select></label>
  <label>Model <select id="model"><option value="lite">lite (faster)</option><option value="full">full (more accurate)</option></select></label>
  <span id="stats"></span>
</div>
<div id="error" hidden></div>
<div id="stage"></div>
<script type="module" src="/src/track/debug.js"></script>
</body>
</html>
