<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Platform Piano poster</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%2300843D'/%3E%3Crect x='7' y='9' width='18' height='12' rx='3' fill='white'/%3E%3Ccircle cx='12' cy='25' r='2' fill='white'/%3E%3Ccircle cx='20' cy='25' r='2' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/src/tokens.css">
<link rel="stylesheet" href="/src/poster/poster.css">
</head>
<body>
<!-- The poster that hangs in a train car. One US Letter page, portrait. The address sets the train:
     poster.html?line=Green-B&dir=1&at=place-bucen&car=2&base=https://<site> -->
<main class="poster" id="poster">
  <header class="top">
    <h1>Play piano<br>with <mark>your feet.</mark></h1>
    <img class="conductor" src="/mascot/conductor.svg" alt="">
  </header>

  <section class="scan" aria-label="Scan to play">
    <div class="qr" id="qr" role="img" aria-label="QR code that opens the game for this car"></div>
  </section>

  <section class="where">
    <span class="badge" id="badge"></span>
    <span class="line" id="line"></span>
    <span class="car" id="car"></span>
    <span class="seats">4 seats, feet only</span>
  </section>

  <ol class="steps">
    <li><b>1</b><span>Scan</span></li>
    <li><b>2</b><span>Pick your stop</span></li>
    <li><b>3</b><span>Look down</span></li>
  </ol>
</main>
<p class="problem" id="problem" hidden></p>
<script type="module" src="/src/poster/main.js"></script>
</body>
</html>
